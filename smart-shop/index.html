<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DRAGON'S STORE</title>

<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/particles.js"></script>

</head>
<body>

<div id="particles-js"></div>

<header>

<div class="titulo">

<img src="img/logo.png" class="logo">

<h1>DRAGON'S STORE</h1>

</div>

<div class="acciones">

<input
type="text"
id="buscar"
placeholder="Buscar..."
onkeyup="buscarProductos()">

<div class="carrito" onclick="toggleCarrito()">
🛒 <span id="contador">0</span>
</div>

</div>

</header>

<section class="grid" id="productos"></section>

<div id="panelCarrito" class="panelCarrito">

<h2>Carrito</h2>

<div id="listaCarrito"></div>

<h3 id="total">Total: S/0</h3>

<button
class="btn finalizar"
onclick="comprarCarrito()">

Comprar seleccionados

</button>

</div>

<div id="modal" class="modal">

<div class="modal-content">

<span class="cerrar"
onclick="cerrarModal()">✖</span>

<img id="modalImg">

<h2 id="modalNombre"></h2>

<p id="modalPrecio"></p>

<p id="modalDesc"></p>

</div>

</div>

<script src="js/app.js"></script>

</body>
</html>
